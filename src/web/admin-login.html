<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Admin — sign in</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#2a323d; --txt:#e6edf3; --dim:#8b949e; --acc:#3fb950;
          --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--txt);
         font:15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  form { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:26px 24px; width:min(92vw,360px); }
  h1 { font-size:17px; margin:0 0 4px; }
  p { margin:0 0 18px; color:var(--dim); font-size:13px; }
  label { display:block; font-size:12px; color:var(--dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.06em; }
  input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:#0b0f14;
          color:var(--txt); font:inherit; }
  button { margin-top:14px; width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
           background:#1f6feb; color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .err { color:#f85149; font-size:13px; min-height:18px; margin-top:10px; }
  code { font-family:var(--mono); font-size:12px; color:var(--dim); }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>Admin panel</h1>
  <p>This page controls every tenant. It needs the <code>ADMIN_TOKEN</code> from this server's <code>.env</code>.</p>
  <label for="t">Admin token</label>
  <input id="t" type="password" name="token" required autofocus spellcheck="false">
  <button id="b" type="submit">Sign in</button>
  <div class="err" id="e" role="alert"></div>
</form>
<script>
  const f = document.getElementById('f');
  f.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const button = document.getElementById('b');
    const err = document.getElementById('e');
    button.disabled = true; err.textContent = '';
    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ token: document.getElementById('t').value }),
      });
      if (res.ok) { location.href = '/admin'; return; }
      const data = await res.json().catch(() => ({}));
      err.textContent = res.status === 429
        ? 'Too many attempts. Wait ' + (data.retryAfter || 60) + 's.'
        : 'That token is not right.';
    } catch {
      err.textContent = 'Could not reach the server.';
    }
    button.disabled = false;
  });
</script>
</body>
</html>
